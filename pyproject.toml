[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data", "output", ".playwright-mcp", "ashitemaru-bilibili-covers"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
