name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Lint
        run: python -m ruff check backend scripts tests deploy
      - name: Check formatting
        run: python -m ruff format --check backend scripts tests deploy
      - name: Run isolated tests
        run: python scripts/test_python.py

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run verify:webkit
      - name: Save failed browser checks
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-${{ github.sha }}
          path: |
            output/webkit-audit/
            output/publishing-audit/
          retention-days: 7
          if-no-files-found: ignore
      - name: Save built frontend
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-${{ github.sha }}
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: error

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit Python runtime dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.lock --strict --disable-pip --no-deps
      - name: Audit external score worker dependencies
        run: |
          python -c 'import json, os, pathlib; pins = json.loads(pathlib.Path("deploy/wahlap-runtime.lock.json").read_text())["dependencies"]; pathlib.Path(os.environ["RUNNER_TEMP"], "wahlap-requirements.txt").write_text("\n".join(pins) + "\n")'
          python -m pip_audit -r "$RUNNER_TEMP/wahlap-requirements.txt" --strict
      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  repository:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python scripts/check_repository.py

  runtime-wheels:
    name: Offline production dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Build and install without a package index
        run: python -m scripts.build_release_dependencies
      - name: Save tested production wheelhouse
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-wheels-${{ github.sha }}
          path: release-dependencies/
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish deployable release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, frontend, dependencies, repository, runtime-wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: frontend-${{ github.sha }}
          path: frontend/dist/
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: runtime-wheels-${{ github.sha }}
          path: release-dependencies/
      - name: Publish immutable commit release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/package_release.py --publish "$GH_REPO"
