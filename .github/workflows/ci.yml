name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Lint
        run: python -m ruff check backend scripts tests deploy
      - name: Check formatting
        run: python -m ruff format --check backend scripts tests deploy
      - name: Run isolated tests
        run: python scripts/test_python.py

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:ci
      - run: npm run verify:webkit
      - name: Save built frontend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ github.sha }}
          path: frontend/dist/
          retention-days: 7
          if-no-files-found: error

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit Python runtime dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements.lock --strict --disable-pip --no-deps
      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  repository:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python scripts/check_repository.py

  runtime-wheels:
    name: Offline production dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Build and install without a package index
        run: python -m scripts.build_release_dependencies
      - name: Save tested production wheelhouse
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-wheels-${{ github.sha }}
          path: release-dependencies/
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish deployable release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, frontend, dependencies, repository, runtime-wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-${{ github.sha }}
          path: frontend/dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime-wheels-${{ github.sha }}
          path: release-dependencies/
      - name: Publish immutable commit release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/package_release.py --publish "$GH_REPO"

  deploy:
    name: Deploy to server
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Download the published archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "app-$GITHUB_SHA" --pattern "mai-journal-$GITHUB_SHA.tar.gz"
      - name: Upload the release without cached wheels and run the server deployer
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::error::DEPLOY_HOST is not set; the release was published but not deployed"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # The server key is restricted to a forced command that accepts only these words.
          remote() {
            ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
              -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 \
              "${DEPLOY_USER:-mai-deploy}@$DEPLOY_HOST" "$1"
          }
          mkdir release
          tar -xzf "mai-journal-$GITHUB_SHA.tar.gz" -C release
          # Cross-border uploads are slow; wheels only change with requirements.lock.
          remote wheels > cached-wheels.txt
          python3 - <<'PY'
          import json, pathlib
          cached = set(pathlib.Path("cached-wheels.txt").read_text().split())
          deps = pathlib.Path("release/dependencies")
          for wheel in json.loads((deps / "manifest.json").read_text())["wheels"]:
              if wheel["sha256"] in cached:
                  (deps / wheel["filename"]).unlink()
                  print("cached:", wheel["filename"])
          PY
          tar -czf upload.tar.gz -C release $(ls release)
          ls -l upload.tar.gz
          { echo "$GITHUB_SHA"; cat upload.tar.gz; } | remote deploy
